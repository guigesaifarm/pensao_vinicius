<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comprovantes de Pensão - Vinicius da Silva Alves</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4',
              500: '#16a34a',
              600: '#15803d',
              700: '#166534',
            }
          }
        }
      }
    }
  </script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body {
      font-family: 'Inter', sans-serif;
    }
    .img-zoom {
      transition: transform 0.3s ease;
    }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-full flex flex-col transition-colors duration-200">

  <!-- Header Section -->
  <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 sticky top-0 z-30 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
      <div>
        <h1 class="text-xl sm:text-2xl font-bold text-slate-900 dark:text-white flex items-center gap-2">
          <i data-lucide="receipt" class="w-6 h-6 text-brand-600 dark:text-brand-500"></i>
          Comprovantes de Pensão - Vinicius da Silva Alves
        </h1>
        <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-0.5 flex items-center gap-1.5">
          <i data-lucide="calendar-range" class="w-4 h-4"></i>
          Período: Junho de 2025 a Outubro de 2026 (Incluindo 13º Salário)
        </p>
      </div>

      <!-- Controls & Theme Toggle -->
      <div class="flex flex-wrap items-center gap-3">
        <!-- Novo Botão de Redirecionamento/Visualização de Depósitos Judiciais e Bloqueios -->
        <button onclick="openJudicialSection()" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold rounded-lg shadow-sm flex items-center gap-1.5 transition-colors">
          <i data-lucide="scale" class="w-4 h-4"></i>
          Depósito Judicial & Bloqueios
        </button>

        <!-- Year Filter -->
        <div class="flex items-center gap-1 bg-slate-100 dark:bg-slate-700 p-1 rounded-lg">
          <button onclick="setFilter('ALL')" id="filter-all" class="filter-btn px-3 py-1.5 text-xs font-medium rounded-md transition-all bg-white dark:bg-slate-800 text-slate-800 dark:text-white shadow-sm">Todos</button>
          <button onclick="setFilter('2025')" id="filter-2025" class="filter-btn px-3 py-1.5 text-xs font-medium rounded-md transition-all text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white">2025</button>
          <button onclick="setFilter('2026')" id="filter-2026" class="filter-btn px-3 py-1.5 text-xs font-medium rounded-md transition-all text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white">2026</button>
        </div>

        <!-- Sort Toggle -->
        <button onclick="toggleSort()" class="p-2 rounded-lg bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 text-xs font-medium flex items-center gap-1.5 transition-colors" title="Alternar Ordenação">
          <i data-lucide="arrow-up-down" class="w-4 h-4"></i>
          <span id="sort-label" class="hidden sm:inline">Mais Recente</span>
        </button>

        <!-- Theme Toggle -->
        <button onclick="toggleTheme()" class="p-2 rounded-lg bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 transition-colors" title="Alternar Tema">
          <i data-lucide="sun" class="w-4 h-4 hidden dark:block"></i>
          <i data-lucide="moon" class="w-4 h-4 block dark:hidden"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content Grid -->
  <main class="flex-1 max-w-5xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div id="grid-container" class="grid grid-cols-1 lg:grid-cols-2 gap-8">
      <!-- Cards renderizados dinamicamente via JS -->
    </div>
  </main>

  <!-- Seção Modal: Depósitos Judiciais & Bloqueios -->
  <div id="judicial-modal" class="fixed inset-0 z-40 bg-black/70 backdrop-blur-sm hidden flex-col items-center justify-center p-4">
    <div class="bg-white dark:bg-slate-800 w-full max-w-4xl rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
      <div class="p-5 border-b border-slate-200 dark:border-slate-700 flex items-center justify-between bg-slate-100 dark:bg-slate-800">
        <h2 class="text-lg font-bold text-slate-900 dark:text-white flex items-center gap-2">
          <i data-lucide="scale" class="w-5 h-5 text-blue-600 dark:text-blue-400"></i>
          Comprovantes de Depósitos Judiciais & Bloqueios de Conta
        </h2>
        <button onclick="closeJudicialSection()" class="p-2 text-slate-500 hover:text-slate-800 dark:hover:text-white rounded-lg">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <div class="p-6 overflow-y-auto grid grid-cols-1 md:grid-cols-2 gap-6" id="judicial-grid">
        <!-- Renderizado via JS -->
      </div>
    </div>
  </div>

  <!-- Lightbox Modal -->
  <div id="lightbox" class="fixed inset-0 z-50 bg-black/90 backdrop-blur-sm hidden flex-col items-center justify-between p-4 transition-opacity duration-200">
    <!-- Lightbox Top Toolbar -->
    <div class="w-full flex items-center justify-between text-white max-w-5xl">
      <span id="lightbox-title" class="font-semibold text-lg"></span>
      <div class="flex items-center gap-2">
        <button onclick="zoomIn()" class="p-2 rounded-lg bg-white/10 hover:bg-white/20 text-white transition-colors" title="Ampliar">
          <i data-lucide="zoom-in" class="w-5 h-5"></i>
        </button>
        <button onclick="zoomOut()" class="p-2 rounded-lg bg-white/10 hover:bg-white/20 text-white transition-colors" title="Reduzir">
          <i data-lucide="zoom-out" class="w-5 h-5"></i>
        </button>
        <button onclick="rotateImage()" class="p-2 rounded-lg bg-white/10 hover:bg-white/20 text-white transition-colors" title="Rotacionar">
          <i data-lucide="rotate-cw" class="w-5 h-5"></i>
        </button>
        <button onclick="closeLightbox()" class="p-2 rounded-lg bg-red-600/80 hover:bg-red-600 text-white transition-colors ml-4" title="Fechar">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
    </div>

    <!-- Lightbox Image View -->
    <div class="flex-1 w-full flex items-center justify-center overflow-hidden my-4">
      <img id="lightbox-img" src="" alt="Comprovante ampliado" class="max-h-[85vh] max-w-full object-contain img-zoom shadow-2xl rounded-lg">
    </div>

    <!-- Lightbox Footer Info -->
    <div class="text-white/60 text-xs text-center">
      Pressione <kbd class="px-1.5 py-0.5 bg-white/20 rounded">ESC</kbd> para fechar
    </div>
  </div>

  <script>
    const BASE_RAW_URL = 'https://raw.githubusercontent.com/guigesaifarm/pensao_vinicius/main/';

    // Mapeamento dos Pagamentos Mensais e 13º
    const MAPA_ITENS = [
      { key: '2025-06', title: 'Junho de 2025', year: 2025, month: 5, filenames: ['junho_2025.jpg', 'Junho_2025.jpg'] },
      { key: '2025-06', title: 'Junho de 2025', year: 2025, month: 5, filenames: ['junho_2025.jpg', 'Junho_2025.jpg'] },
      { key: '2025-07', title: 'Julho de 2025', year: 2025, month: 6, filenames: ['julho_2025.jpg', 'Julho_2025.jpg'] },
      { key: '2025-08', title: 'Agosto de 2025', year: 2025, month: 7, filenames: ['agosto_2025.jpg', 'Agosto_2025.jpg'] },
      { key: '2025-09', title: 'Setembro de 2025', year: 2025, month: 8, filenames: ['setembro_2025.jpg', 'Setembro_2025.jpg'] },
      { key: '2025-10', title: 'Outubro de 2025', year: 2025, month: 9, filenames: ['outubro_2025.jpg', 'Outubro_2025.jpg'] },
      { key: '2025-11', title: 'Novembro de 2025', year: 2025, month: 10, filenames: ['novembro_2025.jpg', 'Novembro_2025.jpg'] },
      { key: '2025-12', title: 'Dezembro de 2025', year: 2025, month: 11, filenames: ['dezembro_2025.jpg', 'Dezembro_2025.jpg'] },
      { key: '2025-13', title: '13º Salário de 2025', year: 2025, month: 11.5, filenames: ['DecimoTerceiro_2025.jpg', 'decimoterceiro_2025.jpg'] },
      
      { key: '2026-01', title: 'Janeiro de 2026', year: 2026, month: 0, filenames: ['janeiro_2026.jpg', 'Janeiro_2026.jpg'] },
      { key: '2026-02', title: 'Fevereiro de 2026', year: 2026, month: 1, filenames: ['fevereiro_2026.jpg', 'Fevereiro_2026.jpg'] },
      { key: '2026-03', title: 'Março de 2026', year: 2026, month: 2, filenames: ['Marcoa_2026.jpg', 'Marcob_2026.jpg'] },
      { key: '2026-04', title: 'Abril de 2026', year: 2026, month: 3, filenames: ['abril_2026.jpg', 'Abril_2026.jpg'] },
      { key: '2026-05', title: 'Maio de 2026', year: 2026, month: 4, filenames: ['maio_2026.jpg', 'Maio_2026.jpg'] },
      { key: '2026-06', title: 'Junho de 2026', year: 2026, month: 5, filenames: ['junho_2026.jpg', 'Junho_2026.jpg'] },
      { key: '2026-07', title: 'Julho de 2026', year: 2026, month: 6, filenames: ['julho_2026.jpg', 'Julho_2026.jpg'] },
      { key: '2026-08', title: 'Agosto de 2026', year: 2026, month: 7, filenames: ['agosto_2026.jpg', 'Agosto_2026.jpg'] },
      { key: '2026-09', title: 'Setembro de 2026', year: 2026, month: 8, filenames: ['setembro_2026.jpg', 'Setembro_2026.jpg'] },
      { key: '2026-10', title: 'Outubro de 2026', year: 2026, month: 9, filenames: ['outubro_2026.jpg', 'Outubro_2026.jpg'] },
      { key: '2026-13', title: '13º Salário de 2026', year: 2026, month: 9.5, filenames: ['DecimoTerceiro_2026.jpg', 'decimoterceiro_2026.jpg'] }
    ];

    // Mapeamento dos Comprovantes Judiciais e Bloqueios
    const MAPA_JUDICIAL = [
      { title: 'Depósito Judicial', filenames: ['deposito_judicial.jpg', 'DepositoJudicial.jpg', 'deposito_judicial.png'] },
      { title: 'Bloqueio de Conta Corrente', filenames: ['bloqueio_conta.jpg', 'BloqueioConta.jpg', 'bloqueio_conta.png'] }
    ];

    let currentFilter = 'ALL';
    let currentSort = 'DESC'; 
    let itemsData = [];
    let judicialData = [];
    let currentZoom = 1;
    let currentRotation = 0;

    function tryLoadImages(item) {
      return new Promise((resolve) => {
        let validSrcs = [];
        let index = 0;

        function checkNext() {
          if (index >= item.filenames.length) {
            item.loadedSrcs = validSrcs;
            item.notFound = validSrcs.length === 0;
            resolve(item);
            return;
          }

          const filename = item.filenames[index];
          const fullUrl = `${BASE_RAW_URL}${filename}`;
          const img = new Image();

          img.onload = () => {
            validSrcs.push({
              url: fullUrl,
              label: item.filenames.length > 1 ? `Comprovante ${index + 1}` : item.title
            });
            index++;
            checkNext();
          };

          img.onerror = () => {
            index++;
            checkNext();
          };

          img.src = fullUrl;
        }

        checkNext();
      });
    }

    function renderGrid() {
      const container = document.getElementById('grid-container');
      container.innerHTML = '';

      let filtered = MAPA_ITENS.filter(item => {
        if (currentFilter === 'ALL') return true;
        return item.year.toString() === currentFilter;
      });

      filtered.sort((a, b) => {
        return currentSort === 'DESC' ? b.month - a.month : a.month - b.month;
      });

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = 'bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-md overflow-hidden flex flex-col hover:shadow-lg transition-shadow';

        let contentHTML = '';

        if (item.loadedSrcs && item.loadedSrcs.length > 0) {
          if (item.loadedSrcs.length > 1) {
            let imagesGrid = '';
            item.loadedSrcs.forEach((imgObj) => {
              imagesGrid += `
                <div class="relative group cursor-pointer overflow-hidden bg-slate-100 dark:bg-slate-900 aspect-[16/11] rounded-xl border border-slate-200 dark:border-slate-700 flex items-center justify-center" onclick="openLightbox('${imgObj.url}', '${item.title} - ${imgObj.label}')">
                  <img src="${imgObj.url}" alt="${item.title} ${imgObj.label}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
                  <div class="absolute bottom-2 left-2 bg-black/60 text-white text-xs px-2 py-0.5 rounded-md backdrop-blur-sm font-medium">
                    ${imgObj.label}
                  </div>
                  <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center gap-1.5 text-white font-medium text-sm">
                    <i data-lucide="maximize-2" class="w-4 h-4"></i> Ampliar
                  </div>
                </div>
              `;
            });

            contentHTML = `<div class="p-5 grid grid-cols-2 gap-4 bg-slate-50 dark:bg-slate-900/40">${imagesGrid}</div>`;
          } else {
            const singleImg = item.loadedSrcs[0];
            contentHTML = `
              <div class="relative group cursor-pointer overflow-hidden bg-slate-100 dark:bg-slate-900 aspect-[16/10] flex items-center justify-center" onclick="openLightbox('${singleImg.url}', '${item.title}')">
                <img src="${singleImg.url}" alt="${item.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
                <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center gap-2 text-white font-medium text-base">
                  <i data-lucide="maximize-2" class="w-5 h-5"></i>
                  Visualizar Comprovante
                </div>
              </div>
            `;
          }
        } else {
          contentHTML = `
            <div class="p-8 bg-slate-50 dark:bg-slate-900/50 aspect-[16/10] flex flex-col items-center justify-center text-center border-t border-slate-100 dark:border-slate-700/50">
              <div class="w-14 h-14 rounded-full bg-amber-100 dark:bg-amber-900/30 text-amber-600 dark:text-amber-400 flex items-center justify-center mb-3">
                <i data-lucide="image-off" class="w-7 h-7"></i>
              </div>
              <p class="text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1">Comprovante não localizado</p>
              <p class="text-xs text-slate-500 dark:text-slate-400 max-w-[260px]">
                Envie a imagem correspondente para o repositório GitHub.
              </p>
            </div>
          `;
        }

        const isAttached = item.loadedSrcs && item.loadedSrcs.length > 0;

        card.innerHTML = `
          <div class="p-5 border-b border-slate-100 dark:border-slate-700 flex items-center justify-between bg-white dark:bg-slate-800">
            <h2 class="font-bold text-slate-900 dark:text-white text-lg flex items-center gap-2.5">
              <i data-lucide="calendar" class="w-5 h-5 text-brand-600 dark:text-brand-500"></i>
              ${item.title}
            </h2>
            ${isAttached 
              ? `<span class="inline-flex items-center gap-1.5 text-xs font-semibold text-emerald-700 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-950/50 px-3 py-1 rounded-full border border-emerald-200 dark:border-emerald-800"><i data-lucide="check-circle" class="w-3.5 h-3.5"></i> ${item.loadedSrcs.length > 1 ? item.loadedSrcs.length + ' Anexos' : 'Anexado'}</span>` 
              : `<span class="inline-flex items-center gap-1.5 text-xs font-semibold text-amber-700 dark:text-amber-400 bg-amber-50 dark:bg-amber-950/50 px-3 py-1 rounded-full border border-amber-200 dark:border-amber-800"><i data-lucide="clock" class="w-3.5 h-3.5"></i> Pendente</span>`
            }
          </div>
          ${contentHTML}
        `;

        container.appendChild(card);
      });

      lucide.createIcons();
    }

    // Modal Judiciais
    function openJudicialSection() {
      const grid = document.getElementById('judicial-grid');
      grid.innerHTML = '';

      judicialData.forEach(item => {
        const card = document.createElement('div');
        card.className = 'bg-slate-50 dark:bg-slate-900/50 rounded-xl border border-slate-200 dark:border-slate-700 p-4 flex flex-col items-center';

        if (item.loadedSrcs && item.loadedSrcs.length > 0) {
          const imgObj = item.loadedSrcs[0];
          card.innerHTML = `
            <h3 class="font-bold text-slate-800 dark:text-slate-100 mb-3">${item.title}</h3>
            <div class="w-full aspect-[16/10] bg-slate-200 dark:bg-slate-800 rounded-lg overflow-hidden relative cursor-pointer group" onclick="openLightbox('${imgObj.url}', '${item.title}')">
              <img src="${imgObj.url}" alt="${item.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
              <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center text-white font-medium text-sm gap-2">
                <i data-lucide="maximize-2" class="w-4 h-4"></i> Ampliar
              </div>
            </div>
          `;
        } else {
          card.innerHTML = `
            <h3 class="font-bold text-slate-800 dark:text-slate-100 mb-2">${item.title}</h3>
            <p class="text-xs text-amber-600 dark:text-amber-400 bg-amber-50 dark:bg-amber-950/40 p-3 rounded-lg border border-amber-200 dark:border-amber-800 text-center">
              Comprovante não localizado no repositório.<br>Adicione o arquivo <b>deposito_judicial.jpg</b> ou <b>bloqueio_conta.jpg</b> no GitHub.
            </p>
          `;
        }

        grid.appendChild(card);
      });

      document.getElementById('judicial-modal').classList.remove('hidden');
      document.getElementById('judicial-modal').classList.add('flex');
      lucide.createIcons();
    }

    function closeJudicialSection() {
      document.getElementById('judicial-modal').classList.add('hidden');
      document.getElementById('judicial-modal').classList.remove('flex');
    }

    function setFilter(year) {
      currentFilter = year;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.remove('bg-white', 'dark:bg-slate-800', 'text-slate-800', 'dark:text-white', 'shadow-sm');
        btn.classList.add('text-slate-600', 'dark:text-slate-300');
      });

      const activeBtn = document.getElementById(`filter-${year.toLowerCase()}`);
      if (activeBtn) {
        activeBtn.classList.add('bg-white', 'dark:bg-slate-800', 'text-slate-800', 'dark:text-white', 'shadow-sm');
        activeBtn.classList.remove('text-slate-600', 'dark:text-slate-300');
      }

      renderGrid();
    }

    function toggleSort() {
      currentSort = currentSort === 'DESC' ? 'ASC' : 'DESC';
      document.getElementById('sort-label').textContent = currentSort === 'DESC' ? 'Mais Recente' : 'Mais Antigo';
      renderGrid();
    }

    function toggleTheme() {
      document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
    }

    function openLightbox(src, title) {
      const modal = document.getElementById('lightbox');
      const img = document.getElementById('lightbox-img');
      const titleElem = document.getElementById('lightbox-title');

      titleElem.textContent = title;
      img.src = src;

      currentZoom = 1;
      currentRotation = 0;
      updateImageTransform();

      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeLightbox() {
      const modal = document.getElementById('lightbox');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function zoomIn() {
      currentZoom = Math.min(currentZoom + 0.25, 3);
      updateImageTransform();
    }

    function zoomOut() {
      currentZoom = Math.max(currentZoom - 0.25, 0.5);
      updateImageTransform();
    }

    function rotateImage() {
      currentRotation = (currentRotation + 90) % 360;
      updateImageTransform();
    }

    function updateImageTransform() {
      const img = document.getElementById('lightbox-img');
      img.style.transform = `scale(${currentZoom}) rotate(${currentRotation}deg)`;
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeLightbox();
        closeJudicialSection();
      }
    });

    window.onload = async () => {
      if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }

      itemsData = await Promise.all(MAPA_ITENS.map(item => tryLoadImages(item)));
      judicialData = await Promise.all(MAPA_JUDICIAL.map(item => tryLoadImages(item)));

      renderGrid();
    };
  </script>
</body>
</html>
