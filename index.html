<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comprovantes de Pensão - Vinicius da Silva Alves</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4',
              500: '#16a34a',
              600: '#15803d',
              700: '#166534',
            }
          }
        }
      }
    }
  </script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body {
      font-family: 'Inter', sans-serif;
    }
    .img-zoom {
      transition: transform 0.3s ease, rotate 0.3s ease;
    }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-full flex flex-col transition-colors duration-200">

  <!-- Header Section -->
  <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 sticky top-0 z-30 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
      <div>
        <h1 class="text-xl sm:text-2xl font-bold text-slate-900 dark:text-white flex items-center gap-2">
          <i data-lucide="receipt" class="w-6 h-6 text-brand-600 dark:text-brand-500"></i>
          Comprovantes de Pensão - Vinicius da Silva Alves
        </h1>
        <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-0.5 flex items-center gap-1.5">
          <i data-lucide="calendar-range" class="w-4 h-4"></i>
          Período: Junho de 2025 a Outubro de 2026
        </p>
      </div>

      <!-- Controls & Theme Toggle -->
      <div class="flex flex-wrap items-center gap-3">
        <!-- Year Filter -->
        <div class="flex items-center gap-1 bg-slate-100 dark:bg-slate-700 p-1 rounded-lg">
          <button onclick="setFilter('ALL')" id="filter-all" class="filter-btn px-3 py-1.5 text-xs font-medium rounded-md transition-all bg-white dark:bg-slate-800 text-slate-800 dark:text-white shadow-sm">Todos</button>
          <button onclick="setFilter('2025')" id="filter-2025" class="filter-btn px-3 py-1.5 text-xs font-medium rounded-md transition-all text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white">2025</button>
          <button onclick="setFilter('2026')" id="filter-2026" class="filter-btn px-3 py-1.5 text-xs font-medium rounded-md transition-all text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white">2026</button>
        </div>

        <!-- Sort Toggle -->
        <button onclick="toggleSort()" class="p-2 rounded-lg bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 text-xs font-medium flex items-center gap-1.5 transition-colors" title="Alternar Ordenação">
          <i data-lucide="arrow-up-down" class="w-4 h-4"></i>
          <span id="sort-label" class="hidden sm:inline">Mais Recente</span>
        </button>

        <!-- Theme Toggle -->
        <button onclick="toggleTheme()" class="p-2 rounded-lg bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 transition-colors" title="Alternar Tema">
          <i data-lucide="sun" class="w-4 h-4 hidden dark:block"></i>
          <i data-lucide="moon" class="w-4 h-4 block dark:hidden"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content Grid -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div id="grid-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Cards renderizados dinamicamente via JS -->
    </div>
  </main>

  <!-- Lightbox Modal -->
  <div id="lightbox" class="fixed inset-0 z-50 bg-black/90 backdrop-blur-sm hidden flex-col items-center justify-between p-4 transition-opacity duration-200">
    <!-- Lightbox Top Toolbar -->
    <div class="w-full flex items-center justify-between text-white max-w-5xl">
      <span id="lightbox-title" class="font-semibold text-lg"></span>
      <div class="flex items-center gap-2">
        <button onclick="zoomIn()" class="p-2 rounded-lg bg-white/10 hover:bg-white/20 text-white transition-colors" title="Ampliar">
          <i data-lucide="zoom-in" class="w-5 h-5"></i>
        </button>
        <button onclick="zoomOut()" class="p-2 rounded-lg bg-white/10 hover:bg-white/20 text-white transition-colors" title="Reduzir">
          <i data-lucide="zoom-out" class="w-5 h-5"></i>
        </button>
        <button onclick="rotateImage()" class="p-2 rounded-lg bg-white/10 hover:bg-white/20 text-white transition-colors" title="Rotacionar">
          <i data-lucide="rotate-cw" class="w-5 h-5"></i>
        </button>
        <button onclick="closeLightbox()" class="p-2 rounded-lg bg-red-600/80 hover:bg-red-600 text-white transition-colors ml-4" title="Fechar">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
    </div>

    <!-- Lightbox Image View -->
    <div class="flex-1 w-full flex items-center justify-center overflow-hidden my-4">
      <img id="lightbox-img" src="" alt="Comprovante ampliado" class="max-h-[85vh] max-w-full object-contain img-zoom shadow-2xl rounded-lg">
    </div>

    <!-- Lightbox Footer Info -->
    <div class="text-white/60 text-xs text-center">
      Pressione <kbd class="px-1.5 py-0.5 bg-white/20 rounded">ESC</kbd> para fechar
    </div>
  </div>

  <script>
    // ==========================================
    // CONFIGURAÇÕES DO REPOSITÓRIO
    // ==========================================
    // Altere este caminho se a pasta de comprovantes estiver em outro diretório
    const PASTA_COMPROVANTES = 'https://github.com/guigesaifarm/pensao_vinicius/blob/main/junho_2025.jpg';

    // Formatos e convenções de nomes suportados para busca automática
    const FORMATOS = ['jpeg', 'jpg', 'png'];

    // Mapeamento dos nomes dos meses
    const NOMES_MESES = [
      'Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho',
      'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'
    ];

    // Estado da Aplicação
    let currentFilter = 'ALL';
    let currentSort = 'DESC'; // 'DESC' = Mais recente primeiro | 'ASC' = Mais antigo primeiro
    let itemsData = [];
    let currentZoom = 1;
    let currentRotation = 0;

    // Gerar a lista de meses (Jun/2025 a Out/2026)
    function generatePeriodList() {
      const list = [];
      const startYear = 2025;
      const startMonth = 5; // Junho (0-indexed)
      const endYear = 2026;
      const endMonth = 9;  // Outubro (0-indexed)

      for (let y = startYear; y <= endYear; y++) {
        const mStart = (y === startYear) ? startMonth : 0;
        const mEnd = (y === endYear) ? endMonth : 11;

        for (let m = mStart; m <= mEnd; m++) {
          const monthStrNum = String(m + 1).padStart(2, '0');
          const monthNameLower = NOMES_MESES[m].toLowerCase();
          
          // Gerar variações de nomes possíveis
          const possiblePaths = [];
          FORMATOS.forEach(ext => {
            possiblePaths.push(`${PASTA_COMPROVANTES}${y}-${monthStrNum}.${ext}`);
            possiblePaths.push(`${PASTA_COMPROVANTES}${monthNameLower}-${y}.${ext}`);
            possiblePaths.push(`${PASTA_COMPROVANTES}${monthStrNum}-${y}.${ext}`);
          });

          list.push({
            year: y,
            month: m,
            monthName: NOMES_MESES[m],
            title: `${NOMES_MESES[m]} de ${y}`,
            possiblePaths: possiblePaths,
            loadedSrc: null,
            notFound: false
          });
        }
      }
      return list;
    }

    // Tentar carregar imagem das rotas possíveis
    function tryLoadImage(item) {
      return new Promise((resolve) => {
        let pathIndex = 0;

        function attemptNext() {
          if (pathIndex >= item.possiblePaths.length) {
            item.notFound = true;
            resolve(item);
            return;
          }

          const currentPath = item.possiblePaths[pathIndex];
          const img = new Image();
          
          img.onload = () => {
            item.loadedSrc = currentPath;
            item.notFound = false;
            resolve(item);
          };

          img.onerror = () => {
            pathIndex++;
            attemptNext();
          };

          img.src = currentPath;
        }

        attemptNext();
      });
    }

    // Renderizar Interface
    function renderGrid() {
      const container = document.getElementById('grid-container');
      container.innerHTML = '';

      // Filtragem
      let filtered = itemsData.filter(item => {
        if (currentFilter === 'ALL') return true;
        return item.year.toString() === currentFilter;
      });

      // Ordenação
      filtered.sort((a, b) => {
        const dateA = new Date(a.year, a.month);
        const dateB = new Date(b.year, b.month);
        return currentSort === 'DESC' ? dateB - dateA : dateA - dateB;
      });

      // Gerar Cards
      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = 'bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm overflow-hidden flex flex-col hover:shadow-md transition-shadow';

        let contentHTML = '';

        if (item.loadedSrc) {
          contentHTML = `
            <div class="relative group cursor-pointer overflow-hidden bg-slate-100 dark:bg-slate-900 aspect-[4/3] flex items-center justify-center" onclick="openLightbox('${item.loadedSrc}', '${item.title}')">
              <img src="${item.loadedSrc}" alt="${item.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
              <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center gap-2 text-white font-medium text-sm">
                <i data-lucide="maximize-2" class="w-5 h-5"></i>
                Visualizar Comprovante
              </div>
            </div>
          `;
        } else {
          contentHTML = `
            <div class="p-6 bg-slate-50 dark:bg-slate-900/50 aspect-[4/3] flex flex-col items-center justify-center text-center border-t border-slate-100 dark:border-slate-700/50">
              <div class="w-12 h-12 rounded-full bg-amber-100 dark:bg-amber-900/30 text-amber-600 dark:text-amber-400 flex items-center justify-center mb-3">
                <i data-lucide="image-off" class="w-6 h-6"></i>
              </div>
              <p class="text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Comprovante não localizado no repositório</p>
              <p class="text-[11px] text-slate-500 dark:text-slate-400 max-w-[220px]">
                Adicione a imagem na pasta <code class="bg-slate-200 dark:bg-slate-800 px-1 py-0.5 rounded text-brand-600 dark:text-brand-400 font-mono">${PASTA_COMPROVANTES}</code> com o nome <code class="bg-slate-200 dark:bg-slate-800 px-1 py-0.5 rounded font-mono">${item.year}-${String(item.month + 1).padStart(2, '0')}.jpeg</code>
              </p>
            </div>
          `;
        }

        card.innerHTML = `
          <div class="p-4 border-b border-slate-100 dark:border-slate-700 flex items-center justify-between bg-white dark:bg-slate-800">
            <h2 class="font-bold text-slate-900 dark:text-white text-base flex items-center gap-2">
              <i data-lucide="calendar" class="w-4 h-4 text-brand-600 dark:text-brand-500"></i>
              ${item.title}
            </h2>
            ${item.loadedSrc ? `<span class="inline-flex items-center gap-1 text-[11px] font-semibold text-emerald-700 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-950/50 px-2 py-0.5 rounded-full border border-emerald-200 dark:border-emerald-800"><i data-lucide="check-circle" class="w-3 h-3"></i> Anexado</span>` : `<span class="inline-flex items-center gap-1 text-[11px] font-semibold text-amber-700 dark:text-amber-400 bg-amber-50 dark:bg-amber-950/50 px-2 py-0.5 rounded-full border border-amber-200 dark:border-amber-800"><i data-lucide="clock" class="w-3 h-3"></i> Pendente</span>`}
          </div>
          ${contentHTML}
        `;

        container.appendChild(card);
      });

      lucide.createIcons();
    }

    // Alterar Filtro
    function setFilter(year) {
      currentFilter = year;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.remove('bg-white', 'dark:bg-slate-800', 'text-slate-800', 'dark:text-white', 'shadow-sm');
        btn.classList.add('text-slate-600', 'dark:text-slate-300');
      });

      const activeBtn = document.getElementById(`filter-${year.toLowerCase()}`);
      if (activeBtn) {
        activeBtn.classList.add('bg-white', 'dark:bg-slate-800', 'text-slate-800', 'dark:text-white', 'shadow-sm');
        activeBtn.classList.remove('text-slate-600', 'dark:text-slate-300');
      }

      renderGrid();
    }

    // Alternar Ordenação
    function toggleSort() {
      currentSort = currentSort === 'DESC' ? 'ASC' : 'DESC';
      document.getElementById('sort-label').textContent = currentSort === 'DESC' ? 'Mais Recente' : 'Mais Antigo';
      renderGrid();
    }

    // Modos Tema (Claro / Escuro)
    function toggleTheme() {
      document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
    }

    // Sistema Lightbox Modal
    function openLightbox(src, title) {
      const modal = document.getElementById('lightbox');
      const img = document.getElementById('lightbox-img');
      const titleElem = document.getElementById('lightbox-title');

      titleElem.textContent = title;
      img.src = src;

      currentZoom = 1;
      currentRotation = 0;
      updateImageTransform();

      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeLightbox() {
      const modal = document.getElementById('lightbox');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function zoomIn() {
      currentZoom = Math.min(currentZoom + 0.25, 3);
      updateImageTransform();
    }

    function zoomOut() {
      currentZoom = Math.max(currentZoom - 0.25, 0.5);
      updateImageTransform();
    }

    function rotateImage() {
      currentRotation = (currentRotation + 90) % 360;
      updateImageTransform();
    }

    function updateImageTransform() {
      const img = document.getElementById('lightbox-img');
      img.style.transform = `scale(${currentZoom}) rotate(${currentRotation}deg)`;
    }

    // Teclado shortcuts (ESC para fechar lightbox)
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeLightbox();
    });

    // Inicialização da Aplicação
    window.onload = async () => {
      // Aplicar tema salvo no localStorage
      if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }

      // Gerar lista de meses
      const list = generatePeriodList();
      
      // Carregar status das imagens
      itemsData = await Promise.all(list.map(item => tryLoadImage(item)));

      // Renderizar UI inicial
      renderGrid();
    };
  </script>
</body>
</html>
